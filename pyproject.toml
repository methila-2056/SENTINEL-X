[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-x"
version = "0.1.0"
description = "AI-Powered Security Incident Intelligence & Autonomous Investigation Platform"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "methila-2056" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Database (PostgreSQL + pgvector)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.4",

    # Cache / background state
    "redis>=5.0",

    # HTTP / LLM clients
    "httpx>=0.27",
    "ollama>=0.3.3",

    # Observability
    "structlog>=24.4",

    # Config / parsing
    "pyyaml>=6.0",

    # ML core
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "matplotlib>=3.9",

    # Embeddings / retrieval
    "sentence-transformers>=3.1",

    # Experiment tracking
    "mlflow>=2.16",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_x"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # long lines handled by formatter where possible
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["sentinel_x"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "xgboost.*",
    "mlflow.*",
    "sentence_transformers.*",
    "pgvector.*",
    "ollama.*",
    "pandas.*",
    "joblib.*",
    "sklearn.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring Docker services (postgres/redis)",
    "evaluation: long-running evaluation suites",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/sentinel_x"]
